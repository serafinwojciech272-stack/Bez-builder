name: BadBuilder CI
on:
  push:
    branches: [main, feature/badbuilder-rebuild]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm test
